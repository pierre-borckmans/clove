[workspace]
resolver = "3"
members = ["crates/clove-core", "crates/clove-cli", "crates/clove-tui"]

[workspace.package]
version = "0.1.18"
edition = "2024"
license = "MIT"
repository = "https://github.com/pierre-borckmans/clove"
rust-version = "1.88"

[workspace.dependencies]
clove-core = { path = "crates/clove-core" }
clove-tui = { path = "crates/clove-tui" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
toml_edit = "0.25"
libc = "0.2"
sha2 = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
