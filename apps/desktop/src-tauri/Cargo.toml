[package]
name = "clove-desktop"
version = "0.1.0"
description = "clove desktop app"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: Tauri's dependency tree stays out of the core's CI.
[workspace]

[lib]
name = "clove_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clove-core = { path = "../../../crates/clove-core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
