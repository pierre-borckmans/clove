# clove on clove: clones start with built Rust deps and installed node_modules.
# `warm` runs in the golden image; `setup` runs in a new clone only when a
# `watch` path changed since the golden commit.

base = "origin/main"

[[step]]
name = "cargo"
warm = "cargo build --workspace --all-targets"

[[step]]
name = "tauri"
warm = "cd apps/desktop/src-tauri && cargo build"

[[step]]
name = "desktop"
warm = "cd apps/desktop && pnpm install --frozen-lockfile"
setup = "cd apps/desktop && pnpm install --prefer-offline --frozen-lockfile"
watch = ["apps/desktop/pnpm-lock.yaml"]

[[step]]
name = "site"
warm = "cd site && pnpm install --frozen-lockfile"
setup = "cd site && pnpm install --prefer-offline --frozen-lockfile"
watch = ["site/pnpm-lock.yaml"]
